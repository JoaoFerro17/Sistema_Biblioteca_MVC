<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca | Cadastro de Autor</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<header th:replace="~{fragments/navbar :: topo('Escritores', ${index != null ? 'Editar Autor' : 'Novo Autor'}, null, null)}"></header>

<main class="container">
    <form th:action="@{/autores}" th:object="${autor}" method="post" class="form-wrapper">
        <input type="hidden" name="index" th:if="${index != null}" th:value="${index}">

        <div class="paper-card">
            <div class="form-group">
                <label for="nome">Nome do Autor</label>
                <input type="text" id="nome" th:field="*{nome}" placeholder="Ex: Machado de Assis" required>
            </div>

            <div class="form-group">
                <label for="nacionalidade">Nacionalidade</label>
                <input type="text" id="nacionalidade" th:field="*{nacionalidade}" placeholder="Ex: Brasileira" required>
            </div>

            <div class="form-group">
                <label for="obrasPublicadas">Obras Publicadas (separadas por vírgula)</label>
                <input type="text" id="obrasPublicadas" th:field="*{obrasPublicadas}" placeholder="Ex: Dom Casmurro, Memórias Póstumas">
            </div>
        </div>

        <div style="display: flex; gap: 0.8rem;">
            <button type="submit" class="btn-primary">Salvar Autor</button>
            <a th:href="@{/autores}" class="btn-light">Cancelar</a>
        </div>
    </form>
</main>

<footer class="footer">
    Sistema de Biblioteca &copy; 2026
</footer>

</body>
</html>
