<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca | Cadastro de Categoria</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<header th:replace="~{fragments/navbar :: topo('Classificação', ${index != null ? 'Editar Categoria' : 'Nova Categoria'}, null, null)}"></header>

<main class="container">
    <form th:action="@{/categorias}" th:object="${categoria}" method="post" class="form-wrapper">
        <input type="hidden" name="index" th:if="${index != null}" th:value="${index}">

        <div class="paper-card">
            <div class="form-group">
                <label for="nome">Nome da Categoria</label>
                <input type="text" id="nome" th:field="*{nome}" placeholder="Ex: Romance Brasileiro" required>
            </div>

            <div class="form-group">
                <label for="descricao">Descrição</label>
                <input type="text" id="descricao" th:field="*{descricao}" placeholder="Ex: Obras clássicas e contemporâneas" required>
            </div>
        </div>

        <div style="display: flex; gap: 0.8rem;">
            <button type="submit" class="btn-primary">Salvar Categoria</button>
            <a th:href="@{/categorias}" class="btn-light">Cancelar</a>
        </div>
    </form>
</main>

<footer class="footer">
    Sistema de Biblioteca &copy; 2026
</footer>

</body>
</html>
