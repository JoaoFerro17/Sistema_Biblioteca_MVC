<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca | Categorias</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<header th:replace="~{fragments/navbar :: topo('Classificação', 'Categorias', '+ Nova Categoria', '/categorias/novo')}"></header>

<main class="container">
    <div th:if="${#lists.isEmpty(categorias)}" class="paper-card empty-paper">
        Nenhuma categoria cadastrada ainda. Clique em <strong>+ Nova Categoria</strong> para adicionar.
    </div>

    <section th:if="${!#lists.isEmpty(categorias)}" class="books-grid">
        <article th:each="categoria, stat : ${categorias}" class="paper-card book-card">
            <div>
                <h3 th:text="${categoria.nome}">Nome da Categoria</h3>
                <p class="meta" th:text="${categoria.descricao}">Descrição da categoria</p>
            </div>

            <div class="card-actions">
                <a th:href="@{/categorias/editar/{index}(index=${stat.index})}" class="btn-sm">Editar</a>
                <a th:href="@{/categorias/excluir/{index}(index=${stat.index})}" class="btn-sm btn-sm-danger">Excluir</a>
            </div>
        </article>
    </section>
</main>

<footer class="footer">
    Sistema de Biblioteca &copy; 2026
</footer>

</body>
</html>
