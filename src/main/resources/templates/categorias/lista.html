<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>BiblioSys | Categorias</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<header class="topbar">
    <div class="topbar-container">
        <a th:href="@{/livros}" class="brand"><span>BiblioSys</span></a>
        <nav class="nav-links">
            <a th:href="@{/livros}">Início</a>
            <a th:href="@{/livros/livro}">Livros</a>
            <a th:href="@{/autores}">Autores</a>
            <a th:href="@{/categorias}" class="active">Categorias</a>
            <a th:href="@{/usuarios}">Usuários</a>
            <a th:href="@{/emprestimos}">Empréstimos</a>
        </nav>
    </div>
</header>

<main class="container">
    <section class="hero-header">
        <div class="hero-text">
            <h1>Categorias</h1>
            <p>Classificação do acervo por gênero ou área.</p>
        </div>
        <a th:href="@{/categorias/novo}" class="btn-primary">+ Nova Categoria</a>
    </section>

    <div class="table-card">
        <table class="data-table">
            <thead>
            <tr>
                <th>Nome</th>
                <th>Descrição</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="cat : ${categorias}">
                <td><strong th:text="${cat.nome}">Nome</strong></td>
                <td th:text="${cat.descricao}">Descrição</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
