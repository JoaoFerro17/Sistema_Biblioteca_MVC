<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca | Início</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<main class="container" style="display: flex; flex-direction: column; justify-content: center;">
    <header class="welcome-header">
        <span>Início</span>
        <h1>Bem-vindo à Biblioteca</h1>
    </header>

    <section class="home-grid">
        <a th:href="@{/livros/lista}" class="paper-card paper-link">
            <h2>Livros</h2>
            <p>Consultar e cadastrar obras</p>
        </a>

        <a th:href="@{/emprestimos}" class="paper-card paper-link">
            <h2>Empréstimos</h2>
            <p>Controlar retiradas e devoluções</p>
        </a>

        <a th:href="@{/usuarios}" class="paper-card paper-link">
            <h2>Usuários</h2>
            <p>Gerenciar leitores cadastrados</p>
        </a>

        <a th:href="@{/autores}" class="paper-card paper-link">
            <h2>Autores</h2>
            <p>Explorar escritores do acervo</p>
        </a>

        <a th:href="@{/categorias}" class="paper-card paper-link card-full">
            <h2>Categorias</h2>
            <p>Organizar gêneros literários</p>
        </a>
    </section>
</main>

<footer class="footer">
    Sistema de Biblioteca &copy; 2026
</footer>

</body>
</html>
