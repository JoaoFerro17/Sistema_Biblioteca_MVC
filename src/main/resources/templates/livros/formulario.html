<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca | Cadastro de Livro</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<header th:replace="~{fragments/navbar :: topo('Acervo', ${index != null ? 'Editar Livro' : 'Novo Livro'}, null, null)}"></header>

<main class="container">
    <form th:action="@{/livros}" th:object="${livro}" method="post" class="form-wrapper">
        <input type="hidden" name="index" th:if="${index != null}" th:value="${index}">

        <div class="paper-card">
            <div class="form-group">
                <label for="titulo">Nome / Título do Livro</label>
                <input type="text" id="titulo" th:field="*{titulo}" placeholder="Ex: Dom Casmurro" required>
            </div>

            <div class="form-group">
                <label for="autor">Autor</label>
                <input type="text" id="autor" th:field="*{autor}" placeholder="Ex: Machado de Assis" required>
            </div>

            <div class="form-group">
                <label for="isbn">ISBN</label>
                <input type="text" id="isbn" th:field="*{isbn}" placeholder="Ex: 978-85-00-00000-0" required>
            </div>
        </div>

        <div style="display: flex; gap: 0.8rem;">
            <button type="submit" class="btn-primary">Salvar Livro</button>
            <a th:href="@{/livros/lista}" class="btn-light">Cancelar</a>
        </div>
    </form>
</main>

<footer class="footer">
    Sistema de Biblioteca &copy; 2026
</footer>

</body>
</html>
