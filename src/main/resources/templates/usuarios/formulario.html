<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca | Cadastro de Usuário</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<header th:replace="~{fragments/navbar :: topo('Leitores', ${index != null ? 'Editar Usuário' : 'Novo Usuário'}, null, null)}"></header>

<main class="container">
    <form th:action="@{/usuarios}" th:object="${usuario}" method="post" class="form-wrapper">
        <input type="hidden" name="index" th:if="${index != null}" th:value="${index}">

        <div class="paper-card">
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" th:field="*{nome}" placeholder="Ex: João Ferro" required>
            </div>

            <div class="form-group">
                <label for="matricula">Matrícula</label>
                <input type="text" id="matricula" th:field="*{matricula}" placeholder="Ex: 2026001" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" th:field="*{email}" placeholder="Ex: joao@email.com" required>
            </div>
        </div>

        <div style="display: flex; gap: 0.8rem;">
            <button type="submit" class="btn-primary">Salvar Usuário</button>
            <a th:href="@{/usuarios}" class="btn-light">Cancelar</a>
        </div>
    </form>
</main>

<footer class="footer">
    Sistema de Biblioteca &copy; 2026
</footer>

</body>
</html>
