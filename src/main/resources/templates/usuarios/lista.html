<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca | Usuários</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<header th:replace="~{fragments/navbar :: topo('Leitores', 'Usuários', '+ Novo Usuário', '/usuarios/novo')}"></header>

<main class="container">
    <div th:if="${#lists.isEmpty(usuarios)}" class="paper-card empty-paper">
        Nenhum usuário cadastrado ainda. Clique em <strong>+ Novo Usuário</strong> para adicionar.
    </div>

    <section th:if="${!#lists.isEmpty(usuarios)}" class="books-grid">
        <article th:each="usuario, stat : ${usuarios}" class="paper-card book-card">
            <div>
                <h3 th:text="${usuario.nome}">Nome do Usuário</h3>
                <p class="meta"><strong>Matrícula:</strong> <span th:text="${usuario.matricula}">0000</span></p>
                <p class="meta"><strong>E-mail:</strong> <span th:text="${usuario.email}">email@exemplo.com</span></p>
            </div>

            <div class="card-actions">
                <a th:href="@{/usuarios/editar/{index}(index=${stat.index})}" class="btn-sm">Editar</a>
                <a th:href="@{/usuarios/excluir/{index}(index=${stat.index})}" class="btn-sm btn-sm-danger">Excluir</a>
            </div>
        </article>
    </section>
</main>

<footer class="footer">
    Sistema de Biblioteca &copy; 2026
</footer>

</body>
</html>
