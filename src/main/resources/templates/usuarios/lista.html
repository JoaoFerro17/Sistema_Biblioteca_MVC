<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>BiblioSys | Usuários</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<header class="topbar">
    <div class="topbar-container">
        <a th:href="@{/livros}" class="brand"><span>BiblioSys</span></a>
        <nav class="nav-links">
            <a th:href="@{/livros}">Início</a>
            <a th:href="@{/livros/livro}">Livros</a>
            <a th:href="@{/autores}">Autores</a>
            <a th:href="@{/categorias}">Categorias</a>
            <a th:href="@{/usuarios}" class="active">Usuários</a>
            <a th:href="@{/emprestimos}">Empréstimos</a>
        </nav>
    </div>
</header>

<main class="container">
    <section class="hero-header">
        <div class="hero-text">
            <h1>Usuários e Leitores</h1>
            <p>Membros cadastrados para realizar empréstimos.</p>
        </div>
        <a th:href="@{/usuarios/novo}" class="btn-primary">+ Novo Usuário</a>
    </section>

    <div class="table-card">
        <table class="data-table">
            <thead>
            <tr>
                <th>Nome</th>
                <th>Matrícula</th>
                <th>E-mail</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${usuarios}">
                <td><strong th:text="${user.nome}">Nome</strong></td>
                <td th:text="${user.matricula}">Matrícula</td>
                <td th:text="${user.email}">E-mail</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
