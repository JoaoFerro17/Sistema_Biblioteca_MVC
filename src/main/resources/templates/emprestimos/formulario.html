<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca | Emprestar</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<header th:replace="~{fragments/navbar :: topo('Empréstimos', ${index != null ? 'Editar Empréstimo' : 'Emprestar'}, null, null)}"></header>

<main class="container">
    <form th:action="@{/emprestimos}" th:object="${emprestimo}" method="post" class="form-wrapper">
        <input type="hidden" name="index" th:if="${index != null}" th:value="${index}">

        <div class="paper-card">
            <div class="form-group">
                <label for="livroTitulo">Título do Livro</label>
                <input type="text" id="livroTitulo" th:field="*{livro.titulo}" placeholder="Ex: Dom Casmurro" required>
            </div>

            <div class="form-group">
                <label for="usuarioNome">Nome do Usuário</label>
                <input type="text" id="usuarioNome" th:field="*{usuario.nome}" placeholder="Ex: Maria Silva" required>
            </div>

            <div class="form-group">
                <label for="dataRetirada">Data de Retirada</label>
                <input type="date" id="dataRetirada" th:field="*{dataRetirada}" required>
            </div>

            <div class="form-group">
                <label for="dataPrevistaDevolucao">Previsão de Devolução</label>
                <input type="date" id="dataPrevistaDevolucao" th:field="*{dataPrevistaDevolucao}" required>
            </div>
        </div>

        <div style="display: flex; gap: 0.8rem;">
            <button type="submit" class="btn-primary">Emprestar</button>
            <a th:href="@{/emprestimos}" class="btn-light">Cancelar</a>
        </div>
    </form>
</main>

<footer class="footer">
    Sistema de Biblioteca &copy; 2026
</footer>

</body>
</html>
