<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca | Empréstimos</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<header th:replace="~{fragments/navbar :: topo('Circulação', 'Empréstimos', '+ Emprestar', '/emprestimos/novo')}"></header>

<main class="container">
    <div th:if="${#lists.isEmpty(emprestimos)}" class="paper-card empty-paper">
        Nenhum empréstimo registrado ainda. Clique em <strong>+ Emprestar</strong> para registrar.
    </div>

    <section th:if="${!#lists.isEmpty(emprestimos)}" class="strip-list">
        <article th:each="emp, stat : ${emprestimos}" class="paper-card strip-card">
            <div class="strip-info">
                <div class="strip-field">
                    <span class="strip-label">Livro</span>
                    <span class="strip-value" th:text="${emp.livro != null ? emp.livro.titulo : '-'}">Livro</span>
                </div>
                <div class="strip-field">
                    <span class="strip-label">Usuário</span>
                    <span class="strip-value" th:text="${emp.usuario != null ? emp.usuario.nome : '-'}">Usuário</span>
                </div>
                <div class="strip-field">
                    <span class="strip-label">Retirada</span>
                    <span class="strip-value" th:text="${emp.dataRetirada}">Data</span>
                </div>
                <div class="strip-field">
                    <span class="strip-label">Previsão</span>
                    <span class="strip-value" th:text="${emp.dataPrevistaDevolucao}">Previsão</span>
                </div>
                <div class="strip-field">
                    <span class="strip-label">Status</span>
                    <span th:if="${emp.dataDevolucao != null}" class="badge badge-done" th:text="'Devolvido em ' + ${emp.dataDevolucao}">Devolvido</span>
                    <span th:if="${emp.dataDevolucao == null}" class="badge badge-active">Em andamento</span>
                </div>
            </div>

            <div class="card-actions">
                <a th:if="${emp.dataDevolucao == null}" th:href="@{/emprestimos/devolver/{index}(index=${stat.index})}" class="btn-sm">Devolver</a>
                <a th:href="@{/emprestimos/editar/{index}(index=${stat.index})}" class="btn-sm">Editar</a>
                <a th:href="@{/emprestimos/excluir/{index}(index=${stat.index})}" class="btn-sm btn-sm-danger">Excluir</a>
            </div>
        </article>
    </section>
</main>

<footer class="footer">
    Sistema de Biblioteca &copy; 2026
</footer>

</body>
</html>
